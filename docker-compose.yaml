services:
  backend:
    build:
      context: ./backend
    container_name: todo_backend
    volumes:
      - todo_data:/app/data
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: todo_frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  todo_data:
